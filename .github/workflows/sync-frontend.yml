name: Sync Frontend to Deployment Repo

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/sync-frontend.yml"

jobs:
  sync-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development repository
        uses: actions/checkout@v4

      - name: Save source commit message
        run: |
          git log -1 --pretty=%B > /tmp/source-commit-message.txt

      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          repository: KaminSirisu/BatmintonClub
          token: ${{ secrets.BADMINTONCLUB_PUSH_TOKEN }}
          path: deployment-repo

      - name: Remove old frontend files from deployment repo
        run: |
          find deployment-repo -mindepth 1 \
            ! -name ".git" \
            ! -path "deployment-repo/.git/*" \
            -exec rm -rf {} +

      - name: Copy frontend files to deployment repo
        run: |
          cp -R frontend/. deployment-repo/

      - name: Commit and push changes
        working-directory: deployment-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No frontend changes to sync."
            exit 0
          fi

          git commit -F /tmp/source-commit-message.txt
          git push